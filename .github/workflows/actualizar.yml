name: Actualizar Convenciones

on:
  schedule:
    # Se ejecuta todos los lunes a las 06:00 AM UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Permite ejecutarlo a mano cuando tú quieras con un botón

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar rastreador
        run: python crawler.py

      - name: Guardar cambios si hay novedades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add convenciones.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-actualización de convenciones" && git push)
